<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solicitud de acceso VICIdial</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f5f8;
        color: #20242a;
    }

    .page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
    }

    .card {
        width: 100%;
        max-width: 520px;
        background: white;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0,0,0,.10);
        overflow: hidden;
    }

    .header {
        background: #202936;
        color: white;
        padding: 24px 28px;
    }

    .header h1 {
        margin: 0;
        font-size: 22px;
    }

    .header p {
        margin: 7px 0 0;
        opacity: .8;
        font-size: 14px;
    }

    .content {
        padding: 28px;
    }

    .field {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        font-size: 14px;
    }

    input,
    textarea {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #ccd2da;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    input:focus,
    textarea:focus {
        border-color: #677487;
    }

    textarea {
        resize: vertical;
        min-height: 80px;
    }

    button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 13px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        background: #202936;
        color: white;
    }

    button:disabled {
        opacity: .6;
        cursor: not-allowed;
    }

    .message {
        display: none;
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
        line-height: 1.5;
        font-size: 14px;
    }

    .success {
        display: block;
        background: #e7f7ec;
        border: 1px solid #aad6b6;
    }

    .error {
        display: block;
        background: #fdeaea;
        border: 1px solid #e6b1b1;
    }

    .status {
        font-weight: bold;
    }

    .footer {
        color: #6b7280;
        font-size: 12px;
        margin-top: 22px;
        text-align: center;
    }
</style>
</head>

<body>

<div class="page">

    <div class="card">

        <div class="header">
            <h1>Solicitud de acceso VICIdial</h1>
            <p>Solicita autorización para tu dirección IP pública.</p>
        </div>

        <div class="content">

            <form id="requestForm">

                <div class="field">
                    <label for="ip">Dirección IP pública</label>
                    <input
                        id="ip"
                        type="text"
                        maxlength="45"
                        placeholder="Ej. 189.203.10.25"
                        required
                    >
                </div>

                <div class="field">
                    <label for="requester">Nombre / Cliente</label>
                    <input
                        id="requester"
                        type="text"
                        maxlength="80"
                        placeholder="Nombre o empresa"
                        required
                    >
                </div>

                <div class="field">
                    <label for="reason">Motivo</label>
                    <textarea
                        id="reason"
                        maxlength="250"
                        placeholder="Ej. Acceso de agentes VICIdial"
                    ></textarea>
                </div>

                <button id="submitBtn" type="submit">
                    Solicitar acceso
                </button>

            </form>

            <div id="message" class="message"></div>

            <div class="footer">
                La solicitud deberá ser autorizada por un administrador.
            </div>

        </div>

    </div>

</div>

<script>
const form = document.getElementById("requestForm");
const button = document.getElementById("submitBtn");
const message = document.getElementById("message");


function showMessage(type, text) {

    message.className = "message " + type;
    message.textContent = text;
}


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    button.disabled = true;
    button.textContent = "Enviando...";

    message.className = "message";
    message.textContent = "";

    const payload = {
        ip: document.getElementById("ip").value.trim(),
        requester: document.getElementById("requester").value.trim(),
        reason: document.getElementById("reason").value.trim()
    };

    try {

        const response = await fetch(
            "https://vicidial97.directo.com/ip-manager-public-api/requests",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            }
        );

        const data = await response.json();

        if (!response.ok) {

            let detail = data.detail || "No fue posible crear la solicitud.";

            if (typeof detail === "object") {
                detail = JSON.stringify(detail);
            }

            throw new Error(detail);
        }

        showMessage(
            "success",
            "Solicitud recibida. Folio #" +
            data.id +
            " | IP: " +
            data.ip +
            " | Estado: " +
            data.status
        );

        form.reset();

    }
    catch (error) {

        showMessage(
            "error",
            error.message
        );
    }
    finally {

        button.disabled = false;
        button.textContent = "Solicitar acceso";
    }

});
</script>

</body>
</html>
